name: CI

on:
  pull_request:
  workflow_call: # invoked as a gate by deploy.yml on push to main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.19"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Biome
        run: bunx @biomejs/biome ci .

      - name: ESLint
        run: bun run lint:eslint

      - name: Knip
        run: bun run knip

      - name: Build web
        run: bun run build:web
